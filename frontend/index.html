<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Pro Max</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">

  <style>
    :root { --rule: 44px; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ---------- Page 1 — Apple, elegant ---------- */
    .page--apple { background: #ffffff; }
    .wordmark {
      color: #1d1d1f;
      font-weight: 600;
      font-size: clamp(2.6rem, 9vw, 7.5rem);
      letter-spacing: -0.035em;
      line-height: 1;
      text-align: center;
      padding: 0 6vw;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 1.1s cubic-bezier(.16,1,.3,1) .15s forwards;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .scroll-cue {
      position: absolute;
      bottom: clamp(1.5rem, 5vh, 3rem);
      left: 50%;
      transform: translateX(-50%);
      color: #86868b;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      opacity: 0;
      animation: rise 1.1s cubic-bezier(.16,1,.3,1) .7s forwards;
    }
    .scroll-cue .chev {
      width: 14px; height: 14px;
      border-right: 1.5px solid #b0b0b5;
      border-bottom: 1.5px solid #b0b0b5;
      transform: rotate(45deg);
      animation: bob 1.8s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: rotate(45deg) translateY(0); } 50% { transform: rotate(45deg) translateY(4px); } }

    /* ---------- Page 2 — white wall: square post-it + Apple search ---------- */
    .page--note {
      background: #ffffff;
      align-items: flex-start;            /* push content toward the top */
      padding-top: clamp(7vh, 12vh, 15vh);
      padding-bottom: 6vh;
    }
    .note-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2.2rem, 6vh, 3.6rem);
    }

    /* the post-it: SQUARE, glued at the top, bottom lifts off the wall */
    .sticky {
      position: relative;
      width: clamp(300px, 40vw, 400px);
      aspect-ratio: 1 / 1;
      padding: clamp(24px, 3vw, 34px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      /* flat, even sticker colour — no dark gradient at the bottom */
      background: #dbed53;
      transform: rotate(-1.4deg);
      /* clean Miro-style shadow: soft, neutral, weighted toward the bottom */
      box-shadow:
        0 1px 2px rgba(35,45,10,.14),
        0 12px 22px -8px rgba(35,45,10,.22);
    }
    /* a small soft pool under the bottom edge — the slight lift off the wall */
    .sticky::before {
      content: "";
      position: absolute;
      left: 7%; right: 7%;
      bottom: 5px;
      height: 16px;
      background: rgba(35,45,10,.24);
      filter: blur(11px);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .note-text { position: relative; z-index: 1; }
    .note-text .sig {
      display: block;
      text-align: right;
      margin-top: .35em;
      transform: rotate(-1deg);
    }

    .note-text {
      font-family: "Gochi Hand", "Comic Sans MS", cursive;
      color: #141414;
      font-size: clamp(.92rem, 2.3vw, 1.16rem);
      line-height: 1.4;
    }
    .note-text .ttl {
      display: block;
      font-size: clamp(1.25rem, 3vw, 1.62rem);
      margin-bottom: .35em;
    }
    .note-text p { margin: 0 0 .22em; }
    .note-text .gl { display: block; margin-top: .55em; }
    .note-text .ttl            { transform: rotate(-1.6deg); }
    .note-text p:nth-of-type(1){ transform: rotate(.6deg);  margin-left: 2px; }
    .note-text p:nth-of-type(2){ transform: rotate(-.8deg); margin-left: -3px; }
    .note-text p:nth-of-type(3){ transform: rotate(.5deg);  margin-left: 4px; }
    .note-text p:nth-of-type(4){ transform: rotate(-.5deg); margin-left: 1px; }
    .note-text p:nth-of-type(5){ transform: rotate(1deg);   margin-left: -2px; }
    .note-text .gl             { transform: rotate(-2.2deg); margin-left: 5px; }

    /* Apple-style "check wallet" search */
    .check { position: relative; width: min(440px, 88vw); }
    .check-ic {
      position: absolute; left: 16px; top: 50%;
      width: 18px; height: 18px; transform: translateY(-50%);
      color: #86868b; pointer-events: none;
    }
    .check-in {
      width: 100%; height: 52px;
      padding: 0 18px 0 46px;
      font: 400 clamp(1rem, 2vw, 1.1rem)/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #1d1d1f; letter-spacing: -0.01em;
      background: #f5f5f7;
      border: 1px solid #e3e3e8;
      border-radius: 14px;
      outline: none;
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
    }
    .check-in::placeholder { color: #86868b; }
    .check-in:focus {
      background: #fff;
      border-color: #0071e3;
      box-shadow: 0 0 0 4px rgba(0,113,227,.16);
    }

    @media (prefers-reduced-motion: reduce) {
      .wordmark, .scroll-cue { animation: none; opacity: 1; transform: none; }
      .scroll-cue .chev { animation: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <!-- Page 1 -->
  <section class="page page--apple">
    <h1 class="wordmark">Coin Pro Max</h1>
    <div class="scroll-cue">
      <span>scroll</span>
      <span class="chev"></span>
    </div>
  </section>

  <!-- Page 2 -->
  <section class="page page--note">
    <div class="note-stack">
      <div class="sticky">
        <div class="note-text">
          <span class="ttl">this is coin pro max</span>
          <p>it has everything and even more</p>
          <p>you can get different rewards by achieving levels</p>
          <p>to achieve any level complete the task assigned to it</p>
          <p>its fully automated and you can track your</p>
          <p>progress by checking ur wallet</p>
          <span class="gl">good luck</span>
          <span class="sig">- Milky</span>
        </div>
      </div>

      <div class="check">
        <svg class="check-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input class="check-in" type="text" placeholder="check wallet" aria-label="check wallet" spellcheck="false" autocomplete="off">
      </div>
    </div>
  </section>

</body>
</html>
